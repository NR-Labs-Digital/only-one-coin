name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Só pra build/typecheck passarem — nenhum valor real, nenhuma rota é
  # exercitada nesse job. Segredo de verdade nunca entra em CI (CLAUDE.md §6).
  NODE_ENV: test
  API_INTERNAL_URL: http://localhost:3333
  PORT: "3333"
  HOST: 0.0.0.0
  REDIS_URL: redis://127.0.0.1:6379
  DATABASE_URL: postgres://ooc:ooc@localhost:5432/ooc_dev
  BETTER_AUTH_URL: http://localhost:3333/api/auth
  BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
  APP_PUBLIC_URLS: http://localhost:3000
  BACKOFFICE_PUBLIC_URL: http://localhost:3000
  AWS_ENDPOINT_URL_S3: http://localhost:9000
  BUCKET_NAME: ci-placeholder-bucket
  AWS_ACCESS_KEY_ID: ci-placeholder-access-key
  AWS_SECRET_ACCESS_KEY: ci-placeholder-secret-key
  # Cloudflare's public TEST keys (always pass) — not a secret.
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  # Portão de CI item 1 (CLAUDE.md §6) — segredo commitado.
  #
  # Roda o binário do gitleaks, não a action `gitleaks/gitleaks-action@v2`: a
  # action recusa rodar em repositório de organização sem `GITLEAKS_LICENSE`
  # ("[NR-Labs-Digital] is an organization. License key is required"), e era
  # isso — não um segredo encontrado — que reprovava este job em todo PR. O
  # gitleaks em si é MIT e não pede licença nenhuma; quem cobra é o wrapper.
  #
  # Trocar o wrapper pelo binário mantém o portão do §6 de pé. Desligar a
  # varredura resolveria o CI vermelho e deixaria o repo sem a única defesa
  # automática contra `.env` commitado — que é justamente o erro proibido que
  # ela existe para pegar.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: um segredo commitado e removido depois continua
          # no histórico, e é lá que ele vaza.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history for committed secrets
        # `--redact` para o próprio log do CI não virar o vazamento; exit != 0
        # quando acha algo, que é o que reprova o merge.
        run: gitleaks git --redact --verbose .

  # Portão de CI item 4 (CLAUDE.md §6) — ESLint com no-floating-promises
  # (todo o monorepo) e no-literal-string (apps/app, via eslint-plugin-i18next
  # em modo jsx-only; apps/landing só em `src/**/*.ts` fora de `src/i18n/**` —
  # cobrir o *template* do .astro fica de fora, pendência conhecida, ver
  # apps/landing/eslint.config.mjs).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (todos os pacotes e apps)
        run: pnpm run lint

  # Portão de CI item 3 (tsc --noEmit) + build de todo o monorepo.
  # Item 2 (varredura de credencial no bundle do Next.js) roda como último
  # passo, depois que apps/app/.next existe de verdade.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (todos os pacotes)
        run: pnpm -r --if-present run typecheck

      # Retry só quando o next/font não alcança o Google Fonts — falha de
      # rede recorrente que derrubava o CI da main e, com ele, os deploys.
      - name: Build (todos os pacotes e apps)
        run: scripts/retry-on-font-fetch.sh pnpm -r build

      - name: Credencial de banco no bundle do cliente (CLAUDE.md §6)
        run: |
          if grep -rIlE "postgres(ql)?://|DATABASE_URL" apps/app/.next/static apps/landing/dist 2>/dev/null; then
            echo "::error::Credencial/string de conexão de banco encontrada em asset servido ao cliente."
            exit 1
          fi
          echo "OK — nenhuma credencial de banco no bundle do cliente."

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # WeasyPrint: a suíte de documentos (OOC-123) gera um PDF de verdade com
      # o mesmo motor da imagem da API (apps/api/Dockerfile).
      - run: sudo apt-get update -q && sudo apt-get install -y -q weasyprint fonts-dejavu-core
      - run: pnpm --filter @ooc/api test
      # A conversão da resposta do modelo de OCR (valor → centavos, data de
      # Lima → UTC) — pura, sem rede: o modelo em si nunca roda no CI.
      - run: pnpm --filter @ooc/ocr test
      # A engine de templates (OOC-123): placeholder fora do tipo, tag que lê
      # arquivo, escape e formatação — pura, sem rede nem banco.
      - run: pnpm --filter @ooc/templates test
      # A escada de resolução das feature flags do app (quem vê o que está
      # desligado) — pura, sem request nem API. Mora neste job, e não num
      # próprio, para não precisar de mais um check obrigatório na proteção
      # da main.
      - run: pnpm --filter @ooc/app test

  # Portão de CI item 6 — migration precisa rodar limpo num banco vazio.
  migrations:
    runs-on: ubuntu-latest
    services:
      # Mesma versão do compose.yml local — as migrations usam uuidv7()
      # nativo (só existe a partir do Postgres 18); 17 falha em runtime.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ooc
          POSTGRES_PASSWORD: ooc
          POSTGRES_DB: ooc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ooc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate banco limpo
        run: pnpm --filter @ooc/db db:migrate
        env:
          DATABASE_URL: postgres://ooc:ooc@localhost:5432/ooc_ci

      # Erro proibido "Delete físico" (CLAUDE.md §6) e "audit_log append-only"
      # (§8) — roda aqui, e não no job test-api, porque estas asserções só
      # existem contra um Postgres de verdade já migrado: cada uma emite a
      # operação proibida direto no banco e exige que ele recuse. Sem banco,
      # o teste não teria o que checar.
      - name: Trava de privilégio no banco (CLAUDE.md §6/§8)
        run: pnpm --filter @ooc/db test
        env:
          DATABASE_URL: postgres://ooc:ooc@localhost:5432/ooc_ci

      # Os repositórios Drizzle cujo SQL o typecheck não verifica — join
      # escrito contra a coluna errada compila e responde "ninguém nessa
      # turma" sobre uma turma cheia. Rodam aqui, e não no job test-api,
      # porque precisam do banco migrado que só existe neste job; `pnpm
      # test:api` continua sendo uma suíte de domínio puro, sem banco.
      - name: Repositórios contra o banco (apps/api)
        run: pnpm --filter @ooc/api test:db
        env:
          DATABASE_URL: postgres://ooc:ooc@localhost:5432/ooc_ci
