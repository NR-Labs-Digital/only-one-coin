# Config do único app hospedado no Fly.io hoje: apps/api (CLAUDE.md §3).
# Fica na raiz do monorepo de propósito — o build context do Docker é
# sempre a raiz onde este arquivo mora (não a pasta do Dockerfile), e
# apps/api/Dockerfile precisa alcançar packages/domain, packages/queue e
# packages/db (docs/ARCHITECTURE.md §5.2). Deploy sempre a partir da raiz:
#   fly deploy
#
# "only-one-coin-api" é placeholder — troque pelo nome real assim que
# rodar `fly apps create` (nome de app é único em toda a Fly, não só na
# sua org).
app = "only-one-coin-api"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

# REDIS_URL, DATABASE_URL, BETTER_AUTH_URL, BETTER_AUTH_SECRET e
# APP_PUBLIC_URLS não entram aqui — são segredo/dado sensível de ambiente,
# vão via `fly secrets set` (nunca em texto plano no fly.toml versionado).
[env]
  NODE_ENV = "production"
  PORT = "3333"
  HOST = "0.0.0.0"

# Blue-green: a máquina nova sobe AO LADO da antiga e só assume o tráfego
# depois que o health check (/health, abaixo) passa. Release que cai no boot
# (secret faltando, erro de config) falha o deploy e a antiga segue no ar —
# em vez de entrar em loop de restart até o Fly desistir e deixar a API
# parada (03/10/2026). Custo: por alguns segundos rodam duas máquinas, com
# os workers do BullMQ nas duas — seguro, os jobs têm jobId e os schedulers
# são idempotentes. Exige health check, e por isso o `[[http_service.checks]]`
# não pode sair.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 3333
  force_https = true
  # Nunca auto-suspender: os workers de fila (BullMQ) rodam no mesmo
  # processo da API (CLAUDE.md §3, "fila mesclada com a API") e precisam
  # estar sempre ligados pra consumir job, não só quando chega request
  # HTTP. auto_stop_machines=true (o default do Fly pra http_service)
  # pausaria a máquina — e a fila junto — no primeiro período ocioso.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# shared-cpu-1x, 512 MB desde 23/10/2026 (OOC-123): o WeasyPrint gera os PDFs
# dos documentos na mesma VM (~60 MB por render, até 2 de uma vez —
# `WeasyPrintRenderer`), e 256 MB não deixavam folga para isso mais a API e
# os workers. Ajustar com `fly scale memory`/`fly scale vm` se o volume de pico
# (até 20.000 matrículas/mês) apertar — sem precisar tocar em código.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
